openapi: 3.1.0
info:
  title: Example schema
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:
  /user:
    get:
      summary: Get a user
      operationId: getUser
      responses:
        "200":
          description: A user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]
